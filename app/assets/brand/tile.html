<!doctype html>
<html><head><meta charset="utf-8">
<!-- Jelly5 home-screen art, rendered to sce_sys/*.png by a headless browser:
     icon0 (512x512 tile), pic0 (selection background), pic1 (launch splash). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
.icon{width:512px;height:512px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 20% 10%,#c06fd8 0%,rgba(192,111,216,0) 55%),
             radial-gradient(110% 100% at 90% 95%,#00b4ef 0%,rgba(0,180,239,0) 60%),
             linear-gradient(135deg,#5a2c86,#0b4f8a);}
.icon::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 120%,rgba(0,0,0,.35),transparent)}
.word{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);text-align:center;
  font:800 128px/1 Inter,sans-serif;letter-spacing:-.055em;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.25);z-index:1}

/* ---- pic0: the selection background ---- */
.pic{width:1920px;height:1080px;position:relative;overflow:hidden;background:#05050a}
.pic .sky{position:absolute;inset:0;
  background:radial-gradient(60% 70% at 78% 18%,rgba(170,92,195,.55),transparent 70%),
             radial-gradient(55% 65% at 95% 95%,rgba(0,164,220,.45),transparent 70%),
             radial-gradient(40% 45% at 55% 60%,rgba(80,60,180,.25),transparent 70%),
             linear-gradient(160deg,#07060f 0%,#0c0820 45%,#03141f 100%)}
.wall{position:absolute;right:-180px;top:-120px;width:1500px;height:1350px;
  transform:perspective(1600px) rotateY(-28deg) rotateX(8deg) rotateZ(-4deg);transform-origin:70% 50%;
  display:grid;grid-template-columns:repeat(7,180px);grid-auto-rows:260px;gap:26px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 38%,#000 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 38%,#000 100%)}
.card{border-radius:18px;position:relative;overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.12)}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%)}
.card::after{content:"";position:absolute;left:14px;right:14px;bottom:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.card.play::after{width:40%;right:auto;background:#fff}
.glow{position:absolute;inset:0;background:radial-gradient(45% 55% at 72% 45%,rgba(140,110,255,.18),transparent 70%)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,10,.96) 0%,rgba(5,5,10,.85) 26%,rgba(5,5,10,.35) 52%,rgba(5,5,10,0) 70%),
  linear-gradient(0deg,rgba(5,5,10,.85) 0%,rgba(5,5,10,0) 30%)}
.brand{position:absolute;right:96px;bottom:84px;display:flex;align-items:center;gap:18px;opacity:.92}
.mark{width:64px;height:64px;border-radius:19px;background:linear-gradient(180deg,#aa5cc3,#00a4dc);
  display:grid;place-items:center;font:800 47px/1 Inter,sans-serif;color:#fff;box-shadow:0 0 40px rgba(0,164,220,.45)}
.brand .w{font:800 64px/1 Inter,sans-serif;letter-spacing:-.05em;color:#f5f5f7}
.brand .t{position:absolute;right:0;top:78px;font:500 22px/1 Inter,sans-serif;color:rgba(235,235,245,.6);white-space:nowrap}

/* ---- pic1: the launch splash (the app's own splash, so the start is seamless) ---- */
.splash{width:1920px;height:1080px;position:relative;overflow:hidden;background:#07070a}
.splash .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(64,42,92,.15),rgba(0,60,85,.08))}
.splash .b{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);display:flex;align-items:center;gap:33px}
.splash .m{width:104px;height:104px;border-radius:30px;background:linear-gradient(180deg,#aa5cc3,#00a4dc);
  display:grid;place-items:center;font:800 77px/1 Inter,sans-serif;color:#fff;box-shadow:0 0 50px rgba(120,110,230,.35)}
.splash .w{font:800 110px/1 Inter,sans-serif;letter-spacing:-.045em;color:#f5f5f7}
</style></head><body>
<div class="icon" id="icon"><div class="word">Jelly5</div></div>

<div class="pic" id="pic">
  <div class="sky"></div>
  <div class="wall" id="wall"></div>
  <div class="glow"></div>
  <div class="shade"></div>
  <div class="brand"><div class="mark">J</div><div class="w">Jelly5</div><div class="t">Jellyfin for PlayStation 5</div></div>
</div>

<div class="splash" id="pic1"><div class="tint"></div><div class="b"><div class="m">J</div><div class="w">Jelly5</div></div></div>

<script>
/* Abstract "posters": gradients in the brand's family and a few warm accents. */
const palettes = [
  ['#3b1f5c','#aa5cc3'],['#0b3f5c','#00a4dc'],['#1d1440','#6e5bd6'],['#40122b','#d65b8a'],
  ['#0f2f2a','#2fbfa0'],['#3a2410','#e0a050'],['#14213d','#4f7cff'],['#2a0f3c','#b45cff'],
  ['#08303a','#38d0e8'],['#301a12','#ff7a59']];
const wall = document.getElementById('wall');
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 42; i++) {
  const [a, b] = palettes[Math.floor(rnd() * palettes.length)];
  const d = document.createElement('div');
  d.className = 'card' + (rnd() < .22 ? ' play' : '');
  const ang = Math.floor(rnd() * 360);
  d.style.background = `radial-gradient(120% 80% at ${20 + rnd() * 60}% ${10 + rnd() * 40}%, ${b} 0%, transparent 70%), linear-gradient(${ang}deg, ${a}, #0a0a14)`;
  d.style.opacity = (0.55 + rnd() * 0.45).toFixed(2);
  wall.appendChild(d);
}
</script>
</body></html>
